services:
  - type: web
    name: ping-server
    runtime: node
    rootDir: .
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        value: https://your-app-name.onrender.com  # Update this after deploy
    plan: free
